<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArkTS 代码知识图谱可视化</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --color-coral-50: #FED2C7;
            --color-coral-100: #FEB9AA;
            --color-coral-500: #F87254;
            --color-coral-600: #EE522F;
            --color-teal-50: #BFFDFD;
            --color-teal-100: #9AF9F9;
            --color-teal-500: #3CDDDD;
            --color-teal-600: #20C5C5;
            --color-indigo-50: #DAD1FF;
            --color-indigo-100: #CABDFF;
            --color-indigo-500: #957AFF;
            --color-indigo-600: #7D5DFD;
            --color-amber-50: #FEE6C3;
            --color-amber-100: #FCD8A1;
            --color-amber-500: #EDAA45;
            --color-lime-50: #E3FDB9;
            --color-lime-100: #CFF98A;
            --color-lime-500: #91DC18;
            --color-slate-50: #F2F2F2;
            --color-slate-100: #E3E3E3;
            --color-slate-200: #D6D6D6;
            --color-slate-300: #C7C7C7;
            --color-slate-400: #BABABA;
            --color-slate-500: #ABABAB;
            --color-slate-600: #8A8A8A;
            --color-slate-700: #686868;
            --color-slate-800: #474747;
            --color-slate-900: #262626;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
            color: var(--color-slate-900);
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }
        
        .metric-card {
            background: linear-gradient(135deg, #fff 0%, #f8f9fa 100%);
            border: 1px solid var(--color-slate-200);
            transition: all 0.3s ease;
        }
        
        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .metric-card.coral { border-left: 4px solid var(--color-coral-500); }
        .metric-card.teal { border-left: 4px solid var(--color-teal-500); }
        .metric-card.indigo { border-left: 4px solid var(--color-indigo-500); }
        .metric-card.amber { border-left: 4px solid var(--color-amber-500); }
        .metric-card.lime { border-left: 4px solid var(--color-lime-500); }
        .metric-card.slate { border-left: 4px solid var(--color-slate-500); }
        
        .nav-tab {
            position: relative;
            transition: all 0.3s ease;
        }
        
        .nav-tab::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--color-indigo-500);
            transition: width 0.3s ease;
        }
        
        .nav-tab.active::after,
        .nav-tab:hover::after {
            width: 100%;
        }
        
        .nav-tab.active {
            color: var(--color-indigo-600);
            font-weight: 500;
        }
        
        #graph-container {
            width: 100%;
            height: 600px;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .entity-card {
            background: #fff;
            border: 1px solid var(--color-slate-200);
            border-radius: 10px;
            padding: 16px;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .entity-card:hover {
            border-color: var(--color-indigo-300);
            box-shadow: 0 4px 16px rgba(125, 93, 253, 0.1);
        }
        
        .entity-card.component {
            border-left: 3px solid var(--color-coral-500);
        }
        
        .entity-card.class {
            border-left: 3px solid var(--color-teal-500);
        }
        
        .entity-card.method {
            border-left: 3px solid var(--color-indigo-500);
        }
        
        .entity-card.file {
            border-left: 3px solid var(--color-amber-500);
        }
        
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }
        
        .badge.component { background: var(--color-coral-50); color: var(--color-coral-600); }
        .badge.entry { background: var(--color-lime-50); color: #2F4B02; }
        .badge.class { background: var(--color-teal-50); color: #067A7A; }
        .badge.method { background: var(--color-indigo-50); color: #5B36F2; }
        .badge.file { background: var(--color-amber-50); color: #7F4E05; }
        
        .search-input {
            background: #fff;
            border: 1px solid var(--color-slate-300);
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 14px;
            transition: all 0.2s ease;
            width: 100%;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--color-indigo-400);
            box-shadow: 0 0 0 3px rgba(125, 93, 253, 0.1);
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }
        
        .btn-primary {
            background: var(--color-indigo-500);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--color-indigo-600);
        }
        
        .btn-secondary {
            background: var(--color-slate-100);
            color: var(--color-slate-700);
            border: 1px solid var(--color-slate-300);
        }
        
        .btn-secondary:hover {
            background: var(--color-slate-200);
        }
        
        .code-block {
            background: #1e1e1e;
            color: #d4d4d4;
            border-radius: 8px;
            padding: 16px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            line-height: 1.6;
            overflow-x: auto;
        }
        
        .code-line {
            display: flex;
        }
        
        .line-number {
            color: #6e7681;
            text-align: right;
            padding-right: 16px;
            min-width: 40px;
            user-select: none;
        }
        
        .line-content {
            flex: 1;
        }
        
        .highlight-line {
            background: rgba(125, 93, 253, 0.15);
        }
        
        .relation-path {
            stroke-dasharray: 5;
            animation: dash 20s linear infinite;
        }
        
        @keyframes dash {
            to { stroke-dashoffset: -100; }
        }
        
        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .sidebar-item {
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        
        .sidebar-item:hover {
            background: var(--color-slate-100);
        }
        
        .sidebar-item.active {
            background: var(--color-indigo-50);
            color: var(--color-indigo-600);
        }
        
        .filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid var(--color-slate-300);
            background: #fff;
        }
        
        .filter-chip:hover {
            border-color: var(--color-indigo-400);
        }
        
        .filter-chip.active {
            background: var(--color-indigo-500);
            color: white;
            border-color: var(--color-indigo-500);
        }
        
        .detail-panel {
            background: #fff;
            border-left: 1px solid var(--color-slate-200);
            height: 100%;
            overflow-y: auto;
        }
        
        .tree-item {
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .tree-item:hover {
            background: var(--color-slate-100);
        }
        
        .tree-children {
            margin-left: 20px;
            border-left: 1px solid var(--color-slate-200);
            padding-left: 8px;
        }
        
        .stats-bar {
            height: 8px;
            border-radius: 4px;
            background: var(--color-slate-200);
            overflow: hidden;
        }
        
        .stats-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        .tooltip {
            position: absolute;
            background: var(--color-slate-800);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        
        .tooltip.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <header class="glass-panel sticky top-0 z-50">
        <div class="max-w-[1600px] mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center">
                        <i data-lucide="network" class="w-5 h-5 text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-semibold text-slate-800">ArkTS 代码知识图谱</h1>
                        <p class="text-xs text-slate-500">可视化代码结构分析系统</p>
                    </div>
                </div>
                
                <nav class="flex items-center gap-8">
                    <button class="nav-tab active" data-tab="overview">
                        <span class="flex items-center gap-2">
                            <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                            总览
                        </span>
                    </button>
                    <button class="nav-tab" data-tab="graph">
                        <span class="flex items-center gap-2">
                            <i data-lucide="git-branch" class="w-4 h-4"></i>
                            关系图谱
                        </span>
                    </button>
                    <button class="nav-tab" data-tab="explorer">
                        <span class="flex items-center gap-2">
                            <i data-lucide="folder-tree" class="w-4 h-4"></i>
                            代码浏览器
                        </span>
                    </button>
                    <button class="nav-tab" data-tab="ai-query">
                        <span class="flex items-center gap-2">
                            <i data-lucide="message-square" class="w-4 h-4"></i>
                            AI 查询
                        </span>
                    </button>
                </nav>
                
                <div class="flex items-center gap-3">
                    <button class="btn btn-secondary" id="export-btn">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        导出
                    </button>
                    <button class="btn btn-primary" id="refresh-btn">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                        刷新
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="max-w-[1600px] mx-auto px-6 py-6">
        
        <!-- 总览页面 -->
        <div id="overview-page" class="page-content">
            <!-- 统计卡片 -->
            <div class="grid grid-cols-6 gap-4 mb-6">
                <div class="metric-card coral rounded-xl p-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs text-slate-500 font-medium">文件总数</span>
                        <i data-lucide="file-code" class="w-4 h-4 text-coral-500"></i>
                    </div>
                    <div class="text-2xl font-semibold text-slate-800" id="stat-files">8</div>
                    <div class="text-xs text-slate-400 mt-1">.ets 文件</div>
                </div>
                
                <div class="metric-card teal rounded-xl p-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs text-slate-500 font-medium">组件数</span>
                        <i data-lucide="box" class="w-4 h-4 text-teal-500"></i>
                    </div>
                    <div class="text-2xl font-semibold text-slate-800" id="stat-components">6</div>
                    <div class="text-xs text-slate-400 mt-1">@Component</div>
                </div>
                
                <div class="metric-card lime rounded-xl p-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs text-slate-500 font-medium">入口组件</span>
                        <i data-lucide="log-in" class="w-4 h-4 text-lime-600"></i>
                    </div>
                    <div class="text-2xl font-semibold text-slate-800" id="stat-entries">2</div>
                    <div class="text-xs text-slate-400 mt-1">@Entry</div>
                </div>
                
                <div class="metric-card indigo rounded-xl p-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs text-slate-500 font-medium">方法数</span>
                        <i data-lucide="function-square" class="w-4 h-4 text-indigo-500"></i>
                    </div>
                    <div class="text-2xl font-semibold text-slate-800" id="stat-methods">44</div>
                    <div class="text-xs text-slate-400 mt-1">函数/方法</div>
                </div>
                
                <div class="metric-card amber rounded-xl p-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs text-slate-500 font-medium">调用关系</span>
                        <i data-lucide="arrow-right-left" class="w-4 h-4 text-amber-500"></i>
                    </div>
                    <div class="text-2xl font-semibold text-slate-800" id="stat-calls">209</div>
                    <div class="text-xs text-slate-400 mt-1">方法调用</div>
                </div>
                
                <div class="metric-card slate rounded-xl p-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs text-slate-500 font-medium">嵌套关系</span>
                        <i data-lucide="layers" class="w-4 h-4 text-slate-500"></i>
                    </div>
                    <div class="text-2xl font-semibold text-slate-800" id="stat-nested">6</div>
                    <div class="text-xs text-slate-400 mt-1">组件嵌套</div>
                </div>
            </div>
            
            <!-- 图表区域 -->
            <div class="grid grid-cols-3 gap-6 mb-6">
                <!-- 实体分布饼图 -->
                <div class="glass-panel rounded-xl p-5">
                    <h3 class="text-sm font-semibold text-slate-700 mb-4 flex items-center gap-2">
                        <i data-lucide="pie-chart" class="w-4 h-4"></i>
                        实体类型分布
                    </h3>
                    <div class="h-48">
                        <canvas id="entity-chart"></canvas>
                    </div>
                </div>
                
                <!-- 文件类型分布 -->
                <div class="glass-panel rounded-xl p-5">
                    <h3 class="text-sm font-semibold text-slate-700 mb-4 flex items-center gap-2">
                        <i data-lucide="folder" class="w-4 h-4"></i>
                        文件目录分布
                    </h3>
                    <div class="h-48">
                        <canvas id="file-chart"></canvas>
                    </div>
                </div>
                
                <!-- 组件层级 -->
                <div class="glass-panel rounded-xl p-5">
                    <h3 class="text-sm font-semibold text-slate-700 mb-4 flex items-center gap-2">
                        <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
                        各组件方法数
                    </h3>
                    <div class="h-48">
                        <canvas id="method-chart"></canvas>
                    </div>
                </div>
            </div>
            
            <!-- 最近活动和快捷操作 -->
            <div class="grid grid-cols-2 gap-6">
                <!-- 组件列表 -->
                <div class="glass-panel rounded-xl p-5">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                            <i data-lucide="box" class="w-4 h-4"></i>
                            组件列表
                        </h3>
                        <button class="text-xs text-indigo-500 hover:text-indigo-600">查看全部</button>
                    </div>
                    <div class="space-y-2" id="component-list">
                        <!-- 动态生成 -->
                    </div>
                </div>
                
                <!-- 快捷查询 -->
                <div class="glass-panel rounded-xl p-5">
                    <h3 class="text-sm font-semibold text-slate-700 mb-4 flex items-center gap-2">
                        <i data-lucide="zap" class="w-4 h-4"></i>
                        快捷查询
                    </h3>
                    <div class="grid grid-cols-2 gap-3">
                        <button class="quick-query-btn p-3 text-left rounded-lg border border-slate-200 hover:border-indigo-300 hover:bg-indigo-50 transition-all" data-query="有哪些入口组件？">
                            <div class="text-xs text-slate-500 mb-1">查询</div>
                            <div class="text-sm font-medium text-slate-700">入口组件</div>
                        </button>
                        <button class="quick-query-btn p-3 text-left rounded-lg border border-slate-200 hover:border-indigo-300 hover:bg-indigo-50 transition-all" data-query="Index组件包含哪些子组件？">
                            <div class="text-xs text-slate-500 mb-1">查询</div>
                            <div class="text-sm font-medium text-slate-700">组件嵌套</div>
                        </button>
                        <button class="quick-query-btn p-3 text-left rounded-lg border border-slate-200 hover:border-indigo-300 hover:bg-indigo-50 transition-all" data-query="UserService有哪些方法？">
                            <div class="text-xs text-slate-500 mb-1">查询</div>
                            <div class="text-sm font-medium text-slate-700">服务方法</div>
                        </button>
                        <button class="quick-query-btn p-3 text-left rounded-lg border border-slate-200 hover:border-indigo-300 hover:bg-indigo-50 transition-all" data-query="哪些组件调用了Logger？">
                            <div class="text-xs text-slate-500 mb-1">查询</div>
                            <div class="text-sm font-medium text-slate-700">调用分析</div>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 关系图谱页面 -->
        <div id="graph-page" class="page-content hidden">
            <div class="grid grid-cols-4 gap-6 h-[calc(100vh-140px)]">
                <!-- 左侧筛选面板 -->
                <div class="glass-panel rounded-xl p-4 overflow-y-auto">
                    <h3 class="text-sm font-semibold text-slate-700 mb-4">图谱筛选</h3>
                    
                    <div class="mb-4">
                        <label class="text-xs text-slate-500 mb-2 block">显示实体类型</label>
                        <div class="space-y-2">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" class="entity-filter" value="component" checked>
                                <span class="w-3 h-3 rounded-full bg-coral-500"></span>
                                <span class="text-sm">组件</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" class="entity-filter" value="class" checked>
                                <span class="w-3 h-3 rounded-full bg-teal-500"></span>
                                <span class="text-sm">类</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" class="entity-filter" value="method">
                                <span class="w-3 h-3 rounded-full bg-indigo-500"></span>
                                <span class="text-sm">方法</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" class="entity-filter" value="file">
                                <span class="w-3 h-3 rounded-full bg-amber-500"></span>
                                <span class="text-sm">文件</span>
                            </label>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="text-xs text-slate-500 mb-2 block">关系类型</label>
                        <div class="space-y-2">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" class="relation-filter" value="contains" checked>
                                <span class="text-sm">包含关系</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" class="relation-filter" value="calls" checked>
                                <span class="text-sm">调用关系</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" class="relation-filter" value="nests" checked>
                                <span class="text-sm">嵌套关系</span>
                            </label>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="text-xs text-slate-500 mb-2 block">布局算法</label>
                        <select id="layout-select" class="search-input">
                            <option value="force">力导向布局</option>
                            <option value="hierarchical">层次布局</option>
                            <option value="circular">环形布局</option>
                        </select>
                    </div>
                    
                    <button class="btn btn-primary w-full" id="reset-graph">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                        重置视图
                    </button>
                </div>
                
                <!-- 图谱容器 -->
                <div class="col-span-3 glass-panel rounded-xl p-4 relative">
                    <div id="graph-container"></div>
                    
                    <!-- 图谱控制按钮 -->
                    <div class="absolute bottom-4 right-4 flex gap-2">
                        <button class="btn btn-secondary" id="zoom-in">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                        <button class="btn btn-secondary" id="zoom-out">
                            <i data-lucide="minus" class="w-4 h-4"></i>
                        </button>
                        <button class="btn btn-secondary" id="fit-graph">
                            <i data-lucide="maximize" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 代码浏览器页面 -->

@Component
struct Index {
  @State userList: User[] = [];

  @State currentPage: number = 1;
  
  private userService: UserService = new UserService();
  private logger: Logger = new Logger('Index');
  
  aboutToAppear() {
    this.logger.info('Page appearing');
    this.loadUsers();
  }
  
  async loadUsers(): Promise<void> {
    this.isLoading = true;
    try {
      this.userList = await this.userService.fetchUsers(this.currentPage);
      this.logger.debug(\`Loaded \${this.userList.length} users\`);
    } catch (error) {
      this.logger.error('Failed to load users', error);
    } finally {
      this.isLoading = false;
    }
  }
  
  build() {
    Column() {
      Header({ title: '用户列表' })
      
      if (this.isLoading) {
        LoadingProgress()
      } else {
        List() {
          ForEach(this.userList, (user: User) => {
            ListItem() {
              UserCard({ user: user })
            }
          })
        }
      }
      
      Footer({ onLoadMore: () => this.onLoadMore() })
    }
  }
}`,
            'test_arkts_project/utils/UserService.ets': `export class UserService {
  private baseUrl: string = 'https://api.example.com';
  private logger: Logger = new Logger('UserService');
  
  async fetchUsers(page: number = 1, pageSize: number = 10): Promise<User[]> {
    this.logger.debug(\`Fetching users, page: \${page}\`);
    
    try {
      const response = await fetch(\`\${this.baseUrl}/users?page=\${page}\`);
      const data = await response.json();
      return data.users as User[];
    } catch (error) {
      this.logger.error('Failed to fetch users', error);
      throw error;
    }
  }
  
  async getUserById(id: number): Promise<User> {
    this.logger.debug(\`Fetching user by id: \${id}\`);
    
    const response = await fetch(\`\${this.baseUrl}/users/\${id}\`);
    const data = await response.json();
    return data as User;
  }
  
  async createUser(userData: Omit<User, 'id'>): Promise<User> {
    this.logger.info('Creating new user');
    
    const response = await fetch(\`\${this.baseUrl}/users\`, {
      method: 'POST',
      body: JSON.stringify(userData)
    });
    const data = await response.json();
    return data as User;
  }
}`,
            'test_arkts_project/utils/Logger.ets': `export class Logger {
  private tag: string;
  private static level: LogLevel = LogLevel.DEBUG;
  
  constructor(tag: string) {
    this.tag = tag;
  }
  
  static setLevel(level: LogLevel): void {
    Logger.level = level;
  }
  
  debug(message: string, ...args: any[]): void {
    if (Logger.level <= LogLevel.DEBUG) {
      console.debug(\`[\${this.tag}] \${message}\`, ...args);
    }
  }
  
  info(message: string, ...args: any[]): void {
    if (Logger.level <= LogLevel.INFO) {
      console.info(\`[\${this.tag}] \${message}\`, ...args);
    }
  }
  
  warn(message: string, ...args: any[]): void {
    if (Logger.level <= LogLevel.WARN) {
      console.warn(\`[\${this.tag}] \${message}\`, ...args);
    }
  }
  
  error(message: string, ...args: any[]): void {
    if (Logger.level <= LogLevel.ERROR) {
      console.error(\`[\${this.tag}] \${message}\`, ...args);
    }
  }
}

enum LogLevel {
  DEBUG = 0,
  INFO = 1,
  WARN = 2,
  ERROR = 3
}`

        // 初始化图谱

        function initGraph() {

            kgData.classes.forEach((cls, index) => {
                nodes.push({

                });
            });
            
            // 添加嵌套关系边
            kgData.componentRelations.forEach(rel => {
                edges.push({
                    from: rel.parent,
                    to: rel.child,
                    label: '包含',
                    color: { color: '#957AFF' },
                    arrows: { to: { enabled: true, scaleFactor: 0.5 } },
                    smooth: { type: 'cubicBezier' }
                });
            });
            
            // 添加调用关系边
            kgData.callRelations.forEach(rel => {
                const caller = rel.caller.split('.')[0];
                const callee = rel.callee.split('.')[0];
                if (caller !== callee) {
                    const existingEdge = edges.find(e => e.from === caller && e.to === callee);
                    if (!existingEdge) {
                        edges.push({
                            from: caller,
                            to: callee,
                            label: '调用',
                            color: { color: '#ABABAB', opacity: 0.5 },
                            arrows: { to: { enabled: true, scaleFactor: 0.3 } },
                            dashes: true,
                            smooth: { type: 'continuous' }
                        });
                    }
                }
            });
            
            const container = document.getElementById('graph-container');
            const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
            
            const options = {
                layout: { improvedLayout: true },
                physics: {

                    barnesHut: {

                        centralGravity: 0.3,
                        springLength: 150,
                        springConstant: 0.04
                    }
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 200,
                    hideEdgesOnDrag: true
                }
            };
