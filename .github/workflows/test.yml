name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-cors requests

    - name: Run unit tests
      run: python -m unittest test_unit_comprehensive -v

    - name: Run integration tests
      run: python -m unittest test_integration -v

    - name: Run extreme coverage tests
      run: python test_extreme_coverage.py

    - name: Run end-to-end tests
      run: python test_end_to_end.py

    - name: Run AI accuracy tests
      run: python test_ai_accuracy.py

    - name: Run SQL validation tests
      run: python test_ai_sql_validation.py
